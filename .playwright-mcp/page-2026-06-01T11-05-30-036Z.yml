                - paragraph [ref=e412]: 10 years old
              - heading [level=3] [ref=e413]: His dream is to run, jump and play football...
              - paragraph [ref=e414]: Volodya, a 10-year-old boy from the Dnipropetrovsk region, was born with atrophied lower limbs and spent years moving on his hands and knees. After the amputation of both lower limbs, he traveled to Minneapolis with the support of the Protez Foundation and took his first steps on training prosthetics. His determination and joy were incredible, as he was able to walk proudly for the first time in his life.
            - generic [ref=e417]:
              - generic [ref=e418]:
                - img [ref=e419]
                - paragraph [ref=e421]: 30 years old, sergeant.
              - heading "Vadym has dedicated 10 years to the Ukrainian Army." [level=3] [ref=e422]
              - paragraph [ref=e423]: Defending Ukraine, he lost two legs with high amputations. Vadym is motivated and does not give up, he inspires everyone with his example. Vadym is currently in the USA undergoing prosthetics fitting and rehabilitation. Only with your help we are able to fit Vadym with modern bionic prosthetics and return him to a full life. Together we are united and strong. Thank you for sharing this post and for your donations
            - generic [ref=e426]:
              - generic [ref=e427]:
                - img [ref=e428]
                - paragraph [ref=e430]: 16 years old, Mariupol.
              - heading [level=3] [ref=e431]: Artem played for the Mariupol youth soccer club, and he wanted to be a professional soccer player.
              - paragraph [ref=e432]: Artem’s dream was to dedicate his life to soccer. On March 2nd, 2022, he went to the local field to play a scrimmage match with his friends. While they were warming up, a Russian drone dropped a grenade on the field. Artem’s best friend Ilya, a boy of 15, was killed. Artem and another boy were severely injured. As a result of the injuries, Artem’s left leg was amputated above the knee, and his right leg is paralyzed. Artem’s dream is now to be able to walk again.
