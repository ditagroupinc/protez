            - paragraph [ref=e1137]: 12 December 2024
            - heading [level=3] [ref=e1138]: "Prosthetic and Rehabilitation Center based on the Ministry of Internal Affairs: an important initiative for military personnel"
            - paragraph [ref=e1139]: On December 12, a meeting was held at the Ministry of Internal Affairs of Ukraine with the Minister of Internal Affairs Ihor Klymenko, the General Director of the Protez Foundation Yura Aroshidze, and the President of Direct Relief Thomas Tighe. The meeting was also attended by Deputy Minister of Internal Affairs of Ukraine Kateryna Pavlichenko. The main topic of negotiations was the creation of a prosthetic and rehabilitation center based on one of the medical institutions of the Ministry of Internal Affairs.
          - generic [ref=e1142]:
            - paragraph [ref=e1144]: 04 Aug 2025
            - 'heading "“L.P.S: Ukraine–USA”: 10 lyceum students of the Ministry of Internal Affairs went to the USA" [level=3] [ref=e1145]'
            - paragraph [ref=e1146]: "10 lyceum students of the Ministry of Internal Affairs went to the USA as part of the educational trip “L.P.S: Ukraine-USA”. This is a unique opportunity for young Ukrainians to get acquainted with American culture, values, the security system and the work of the police, rescuers and military. And at the same time - to adequately present Ukrainian culture, strength of spirit and patriotism. The trip is organized in cooperation with the Prosthesis Foundation and the Ministry of Internal Affairs of Ukraine. We have been working on this project for more than four months to create a rich and valuable program for lyceum students."
          - generic [ref=e1149]:
            - paragraph [ref=e1151]: 2 July 2025
            - heading [level=3] [ref=e1152]: Laying of the Time Capsule for the Ministry of Internal Affairs Center
            - paragraph [ref=e1153]: Minister of Internal Affairs Ihor Klymenko, together with Protez Foundation President Yura Aroshidze, laid a time capsule in the foundation of Ukraine’s first Ministry of Internal Affairs Prosthetics and Orthotics Center. The facility is currently under reconstruction. Once completed, it will be equipped with state-of-the-art technology. The Center will become a space of support, recovery, and dignity for defenders with amputations.
